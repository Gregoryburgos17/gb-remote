# Builds the apps on every push and publishes them as a release for tags v*.
# Download links for customers (always the newest release):
#   https://github.com/<owner>/gb-remote/releases/latest/download/GBRemote.exe
#   https://github.com/<owner>/gb-remote/releases/latest/download/GBRemote.apk
#
# Settings > Secrets and variables > Actions:
#   variable GBREMOTE_SERVER            address of the platform baked in both apps
#   secrets  GBREMOTE_KEYSTORE_BASE64,  Android signing key (optional: without it the APK
#            GBREMOTE_KEYSTORE_PASSWORD, is signed with a throwaway key and a new version
#            GBREMOTE_KEY_ALIAS,         cannot be installed over the previous one)
#            GBREMOTE_KEY_PASSWORD
name: Build GB Remote

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.GBREMOTE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.GBREMOTE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gbremote.jks"
          echo "GBREMOTE_KEYSTORE=$RUNNER_TEMP/gbremote.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          GBREMOTE_SERVER: ${{ vars.GBREMOTE_SERVER }}
          GBREMOTE_KEYSTORE_PASSWORD: ${{ secrets.GBREMOTE_KEYSTORE_PASSWORD }}
          GBREMOTE_KEY_ALIAS: ${{ secrets.GBREMOTE_KEY_ALIAS }}
          GBREMOTE_KEY_PASSWORD: ${{ secrets.GBREMOTE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk GBRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GBRemote-android
          path: GBRemote.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server address
        if: vars.GBREMOTE_SERVER != ''
        shell: pwsh
        env:
          GBREMOTE_SERVER: ${{ vars.GBREMOTE_SERVER }}
        run: |
          $source = Get-Content windows/GBRemote.cs -Raw -Encoding utf8
          $source = $source.Replace('"https://soporte.gbcore.com"', '"' + $env:GBREMOTE_SERVER + '"')
          [IO.File]::WriteAllText("$PWD/windows/GBRemote.cs", $source, [Text.UTF8Encoding]::new($false))
      - name: Build GBRemote.exe
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /codepage:65001 /target:winexe `
            /platform:anycpu /optimize+ /out:GBRemote.exe /r:System.Management.dll /r:System.Web.Extensions.dll `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll windows/GBRemote.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GBRemote-windows
          path: GBRemote.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            GBRemote.apk
            GBRemote.exe
